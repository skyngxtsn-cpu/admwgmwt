  <script id="manual-md" type="text/markdown"># 薬局棚卸しアプリ 従業員用マニュアル

---

## 1. はじめに

薬局の棚卸しをスマホで行うためのアプリです。
棚の前に立って、数量と有効期限を入力していくと、Google スプレッドシートに自動で記録されます。
数量差異や期限切迫品も自動で判定し、後で確認できます。

### 公開URL

```
https://skyngxtsn-cpu.github.io/admwgmwt/
```

### ホーム画面に追加すると便利

iPhone や iPad の場合：

1. Safari で上記URLを開く
2. 画面下部の共有ボタン（四角と上矢印）をタップ
3. 「ホーム画面に追加」を選ぶ
4. 名前はそのままで「追加」

ホーム画面のアイコンから、通常のアプリのように起動できます。

---

## 2. 画面の全体構成

### ヘッダ

画面の一番上の青いエリアです。以下の情報が表示されます。

- 左：アプリ名「薬局棚卸し」
- 右：**🔧 従業員メニュー**（VAN取込・切迫品更新・マニュアル・アプリ更新）
- 右：**⚙ 管理者メニュー**（マスタ更新・新棚卸し開始・URL切替）— **触らないでください**
- 下段：現在使用中のスプレッドシート名（シートアイコン付き）
- 下段：現在の棚卸しの月（カレンダーアイコン付き）と「変更」— **触らないでください**
- 下段：実施日（今日の日付が自動入力、変更可能）

### タブ

ヘッダの下に2つのタブがあります。

- 個別記録：単発の期限記録用（日常業務）
- 棚卸しモード：定期棚卸し作業用（主に使う方）

### 実施日について

「実施日」は、今日その棚卸し作業を行った日付として記録されます。
デフォルトで今日の日付が入っていますが、カレンダーから変更できます。
過去に遡って記録したい時（例：昨日忘れていた分を今日入力）に使います。

---

## 3. 棚卸しの基本フロー

### 大まかな流れ

1. **棚卸しを始める前**：VANから在庫データを取り込む（詳細は6章）
2. **棚卸し中**：棚番を選ぶ → カードで数量と期限を入力 → 記録して次へ（繰り返し）
3. **棚卸しが終わったら**：切迫品シートを更新する（詳細は下記）

途中でアプリを閉じても、続きから再開できます。

### 棚卸し中の3ステップ

1. **棚番を選ぶ** — 一覧から今回数える棚をタップ
2. **カードで数量と期限を入力する** — 1品ずつ表示されるカードで入力
3. **記録して次へ** — ボタンを押すと自動で次の品目に進む

### 棚卸しが終わったら：切迫品シートを更新する

棚卸しモードでは、記録した期限は **自動で切迫品シートに反映されません**。
棚卸しが一通り終わったら、必ず以下を実施してください。

1. 画面右上の工具ボタン（メンテナンス）をタップ
2. 「切迫品シートを更新」ボタン（緑色）をタップ
3. 「切迫品シートを最新化しました」と表示されたら完了

これで、記録した期限が切迫品シート（18ヶ月以内に期限切れの薬の一覧）に反映されます。

なお、**個別記録タブで期限を記録した場合は自動で切迫品シートが更新されます**。
手動更新が必要なのは棚卸しモードでの記録後だけです。

---

## 4. 詳しい操作方法

### 4-1. 棚番を選ぶ

「棚卸しモード」タブで、下部の棚番一覧から今回数える棚をタップします。

#### 棚番の絞り込み

棚番が多い時は、検索欄に棚番の一部を入力すると絞り込めます。
例：「F」と入力すると F- で始まる棚番だけ表示されます。

#### 棚番一覧の見方

各棚のカードには以下が表示されています。

- 棚番名
- 進捗バー（何%終わったか）
- 現在の進捗（例：8/10）
- 「未実施のみ」モード時は「残 X品目」

---

### 4-2. カウントモード

棚番一覧の上に3つのボタンがあります。目的に応じて切り替えます。

#### 全品目
その棚の全ての品目をカードで表示します。通常はこのモードで作業します。

#### 未実施のみ
その棚の中で、まだ今日数えていない品目だけを表示します。
途中まで数えて中断し、翌日以降に続きをやりたい時に便利です。

#### 差異品再カウント
過去に数量差異が出た品目だけをまとめてカード表示します。
棚卸しが終わったあと、念のため差異品だけ再確認したい時に使います。

---

### 4-3. 全体進捗の見方

棚番一覧の上部に「全体の進捗」バーがあります。
店全体の棚卸し進捗（例：320 / 1608 品目、19%）が確認できます。

各棚のカードにも棚ごとの進捗が表示されます。

---

### 4-4. 品目カードの見方

棚を選ぶと、その棚の品目が1つずつカード表示されます。上から順に以下が並びます。

- 品目名（例：アーチスト錠10mg）
- 単位・メーカー名
- 棚番と「変更」ボタン
- 数量セクション（理論在庫、一致ボタン、数量入力欄）
- 期限セクション（VAN期限がある場合は表示、なければ入力欄）
- 記録して次へ ボタン
- 前へ / スキップ ボタン

カード上部には現在の位置（例：3 / 41 品目）と、棚内の品目を検索してジャンプする欄があります。

---

### 4-5. 数量の入力方法

品目カードの数量セクションで、実際の在庫数を入力します。

#### 理論在庫と合っている場合

「一致」ボタンをタップします。ボタンが緑色に変わり、理論在庫の値がそのまま記録されます。

#### 理論在庫と違う場合

数量入力欄に、実際に数えた数を入力します。

#### 補足

- 数字はキーボードで入力してください（テンキーが自動で出ます）
- 「一致」を先に押した後でも、数量入力欄に値を入れると、そちらが優先されます

---

### 4-6. 期限の入力方法

期限セクションは、品目によって表示が変わります。

#### VAN期限が登録されている品目

カードに「VAN登録期限」として日付が表示されます（例：2027-11）。

- 現物と同じ：「一致」ボタンをタップ
- 現物と違う：「違う」ボタンをタップ → 正しい期限の入力欄が出る

「違う」を選んだあと、複数の期限を入力できます。
1つ目を入力すると、自動で2つ目の空欄が現れます。
必要な数だけ入力してください（空欄のままの欄は無視されます）。

#### VAN期限がない品目

期限入力欄がそのまま表示されます。
切迫品（18ヶ月以内に期限切れになる薬）だけ、期限を入力してください。
切迫品がなければ空欄のままでOKです。

こちらも複数入力可能です。

#### 期限の入力形式

年月（YYYY-MM）形式です。カレンダーから月単位で選択します。

---

### 4-7. 棚番の変更

品目の棚番が実際と違っていた場合、カード内の「変更」ボタンから新しい棚番を選べます。

#### 手順

1. カード内の「変更」ボタンをタップ
2. セレクトボックスから新しい棚番を選ぶ
3. そのまま「記録して次へ」ボタンを押す

「決定」ボタンを個別に押す必要はありません。「記録して次へ」を押した時に、棚番変更も同時に保存されます。

キャンセルしたい場合は「×」ボタンを押します。

---

### 4-8. 記録して次へ

カード下部の「記録して次へ」ボタンを押すと、記録が保存され自動で次の品目に進みます。

- 差異がない場合：無音でサクサク進む
- 差異があった場合：画面下に警告メッセージが出る
- VAN期限と違う判定をした場合：画面下に「期限相違」メッセージが出る

ネット状況が悪くて記録が失敗した場合は、赤いメッセージで通知されます。その時は該当品目を戻って再度記録してください。

---

### 4-9. 前へ・スキップ

カード下部に2つのナビゲーションボタンがあります。

- 「← 前へ」：1つ前の品目カードに戻る
- 「スキップ →」：この品目は数えずに次へ進む（記録しない）

前へは複数回押せば何品目でも戻れます。
スキップした品目はあとで「未実施のみ」モードで再確認できます。

---

### 4-10. カード内の品目ジャンプ検索

カード上部に「品目を検索してジャンプ」という検索欄があります。
その棚内の品目名を入力すると、候補が表示され、タップで該当品目のカードに直接ジャンプできます。

例：「アーチスト」と入力 → 候補が出る → タップ → その品目のカードが表示される。

順番に進めなくても、飛ばしたい時や戻りたい時に使えます。

---

### 4-11. 途中で中断・再開

途中でアプリを閉じても、内容は保持されます。

次に同じ棚を選ぶと「〇〇棚の続き（N品目〜）を再開しますか？」というダイアログが出ます。

- 「OK」：続きから再開
- 「キャンセル」：最初から

同じ棚を別の日に続けたい場合も同じ動作です。

---

### 4-12. 記録の取消

記録直後、画面下のメッセージに「取消」ボタンが8秒間表示されます。
押すと、たった今の記録を削除できます。

見逃してしまった場合は、「個別記録」タブの「直近の入力」欄からも該当行の「取消」ボタンで削除可能です。
直近の入力欄には、最近記録した10件程度が表示されます。

---

## 5. 個別記録タブ（日常業務での期限記録）

棚卸し中以外の日常業務で、新しく入荷した薬の期限を記録したい時などに使います。

### 使う場面

- 新しく入荷した薬の期限をチェック
- 他店から回ってきた薬の期限を確認・記録
- 棚卸し以外のタイミングで単発で記録したい

### 手順

1. 上部のタブで「個別記録」を選択
2. 「医薬品を検索」欄に薬品名を入力（2文字以上）
3. 候補一覧から該当する薬をタップ
4. 選択された薬のカードで、有効期限を入力（複数可能）
5. 数量を入力（省略可能、空欄OK）
6. 「記録する」ボタンをタップ

### 検索できるキーワード

- 医薬品名（例：「アーチスト」）
- カナ名（例：「アーチスト」）
- YJコード（例：「2149032」）
- JANコード（バーコード番号）

### 期限だけ・数量だけ・両方の使い分け

- 期限だけ入力：期限確認用（数量は0で記録）
- 数量だけ入力：数量記録用
- 両方入力：完全な記録

期限を入力した場合、記録後に切迫品シートが自動で更新されます。

### マスタに無い薬（新薬など）の手入力記録

医薬品マスタに載っていない薬でも記録できます。

1. 検索欄に薬品名を入力（例：「新薬名」）
2. 検索結果が「該当なし」になると、下に **「「〇〇」を手入力で記録」ボタン** が現れる
3. ボタンをタップ → 確認ダイアログで「OK」
4. 通常通り期限・数量を入力して「記録する」

**注意点：**

- 手入力で記録した薬は棚卸し記録シートに書き込まれます（YJコード・規格は空欄）
- 医薬品マスタには追加されません（マスタ更新は管理者が行います）
- 検索でヒットしない新薬を臨時で記録したい時のための機能です

### 直近の入力

同じタブの下部に「直近の入力」欄があり、最近記録した10件程度が表示されます。
誤って記録した場合は「取消」ボタンで削除できます。

---

## 6. VANの在庫データを更新する

このアプリの「理論在庫」を最新化するために、VANから在庫データを出してアプリに取り込む作業です。
棚卸しを始める前に必ず実施してください。

### いつやるか

- 棚卸しを始める日の朝
- 部分棚卸しで日をまたぐ場合は、その日の作業を始める前
- 途中で在庫が動いた後（日をまたいだ後）

### 手順1：VANから在庫CSVを出力する

1. VAN を開き、画面上部の日付が **今日** になっていることを確認する
2. 「初期表示」ボタンを押して、薬局の在庫が全て表示された状態にする
3. 画面下のタブから「CSV」を選ぶ
4. 画面上のタブから「5. 棚卸用アプリ」を選ぶ
5. 出力ボタンを押す

デスクトップに CSV ファイルが生成されます（ファイル名の例：`20260729140347_Fメニュー`）。
ファイル名の先頭には出力した日時が入ります。

### 手順2：アプリで取り込む

1. デスクトップの「薬局棚卸しアプリ」を開く
2. 画面右上の工具ボタン（メンテナンス）をタップ
3. 「VANの在庫データを取込」ボタンをタップ
4. ファイル選択画面が開く
5. 「SDN」フォルダを開く
6. 先ほど生成した `_Fメニュー` の付いたファイルを選ぶ（複数ある場合は日時が一番新しいもの）
7. 「取込完了：N件更新、M件追加」と表示されたら完了

### 注意点

- 棚卸しの途中に取り込むと、その時点までに書き込まれた理論在庫が最新のVANデータで上書きされます
- 通常は「棚卸しを始める前」に一度だけ実行してください
- 部分棚卸しで日をまたぐ場合は「その日の作業を始める前」に実行してください
- 取り込みの前に、必ず VAN の日付が今日になっていることを確認してください

### 取り込み後に更新される項目

- 自店在庫シートの「理論在庫」列
- 自店在庫シートの「VAN期限」列
- 自店在庫シートに新しい品目があれば追加されます

棚卸し記録・進捗などは上書きされません。

## 7. 新しい棚卸しを始める（月次の切替）

毎月1回、次の棚卸しへ切り替える作業です。**この操作は管理者が行います**が、切替後にアプリで何が変わって何が残るかを知っておくと、いざ担当した時に慌てません。

### この操作はどこにあるか

管理者メニュー（ヘッダの ⚙）の中にあります。従業員メニュー（🔧）にはありません。管理者が「⚙ → 新しい棚卸しを始める」から実行します。

### 消えるもの（次の棚卸しに向けて空にする）

| シート・項目 | 変化 |
|---|---|
| 自店在庫シートの「最終棚卸日」列 | 空になる |
| 自店在庫シートの「VAN期限」列 | 空になる（次回のVAN取込で再登録される） |
| 差異品シート | 全レコード削除 |
| 期限相違ありシート | 全レコード削除 |
| 棚番変更シート | 全レコード削除 |
| アプリの進捗表示（未実施／実施済み） | すべて未実施に戻る |

### 残るもの（履歴・マスタは保持）

| シート・項目 | 状態 |
|---|---|
| 自店在庫シートの「理論在庫」列 | そのまま（次回のVAN取込で最新化） |
| 医薬品マスタ | そのまま |
| 棚卸し記録シート | 過去の全履歴が残る |
| 切迫品シート | 次の棚卸しが進むまで前月の内容を参照用に残す |
| スプレッドシート接続設定 | そのまま |

### 新しい棚卸しが始まった後、従業員がすること

1. **ヘッダの 📅 バッジで新しい月になっているか確認**（例：「2026年10月」）
2. **VANの在庫データを取り込む**（🔧 → VANの在庫データを取込）
   - 最終棚卸日・VAN期限が空になっているので、まずVANデータで再登録
3. **実施日を今日にする**（ヘッダの 📆 実施日）
4. **通常通り棚卸しを開始**（棚番を選ぶ → 品目カードで入力）

### よくある質問

**Q. 前の月の記録が消えたように見える**
A. アプリ画面上の進捗表示が「未実施」に戻っているだけで、棚卸し記録シートには全て残っています。スプレッドシートを開けば確認できます。

**Q. 切迫品リストが残っているけど大丈夫？**
A. 意図的にそう設計されています。次の棚卸しが終わるまで、参考として前月の切迫品リストを見られるようにしています。新しい棚卸しが進むと、「切迫品シートを更新」ボタンで自動的に最新化されます。

**Q. VANの取込前に棚卸ししていい？**
A. できれば取込を先にしてください。取込を後にすると、書き込んだ数量が最新のVANデータで上書きされ、食い違いが出やすくなります。

**Q. 差異品シートが空になったけど、前月分は？**
A. 差異品・期限相違・棚番変更の各シートは「今のサイクルで対処すべき件」を貯めるためのシートなので、月が変わると空になります。過去の記録は棚卸し記録シートに全て残っています。

### 6-2. 棚卸し記録シート

棚卸しモード・個別記録タブで「記録した」全ての履歴が入っています。
1回の記録につき1行、期限が複数ある場合はその数だけ行が追加されます。

#### 列の意味

| 列 | 名前 | 内容 |
|---|---|---|
| A | 棚卸し日 | 実施日（アプリで設定した日） |
| B | YJコード | 個別医薬品コード |
| C | 医薬品名 | 薬の名前 |
| D | 単位 | 錠、g など |
| E | 有効期限 | YYYY-MM形式（期限なしの記録もあり） |
| F | 数量 | 実在庫数 |
| G | 棚位置 | 棚番 |
| H | メモ | 個別記録タブで入力したメモなど |
| I | 状態 | ok / impending（切迫） / expired（期限切れ） / counted（期限なし） |
| J | 入力日時 | 実際にアプリで記録したタイムスタンプ |
| K | サイクル | 何月分の棚卸しか（例：2026年9月） |

#### いつ見るか

- 記録漏れがないか確認する時
- 過去の記録を振り返る時
- 誤入力を修正する時（該当行を編集）

---

### 6-3. 切迫品シート

**18ヶ月以内に期限が切れる薬** が一覧表示されます。棚卸しで期限を記録した薬から自動抽出されます。

#### 見方

- 1行目：期限の月（例：2026.09 / 2026.11 / 2027.03 …）
- 2行目以降：その期限月に該当する医薬品名が縦に並ぶ

期限月が古い列ほど左、新しい列ほど右に並びます。

#### いつ見るか

- 使い切りたい薬の優先順位を決める時
- 廃棄予定品のリストアップ

#### 更新タイミング

- 個別記録タブで期限を記録した後は自動更新
- 棚卸しモードでは自動更新なし（管理者が手動で「切迫品シートを更新」ボタンを押す）

---

### 6-4. 差異品シート

**理論在庫と実際の在庫数が違った薬** の一覧です。

#### 列の意味

| 列 | 名前 | 内容 |

| A | 棚卸し日 | 実施日 |
| B | 棚番 | 該当薬の棚番 |
| C | 医薬品名 | 薬の名前 |
| D | 理論在庫 | システム上の在庫数 |
| E | 実在庫 | 実際に数えた数 |
| F | 差異 | 実在庫 − 理論在庫（マイナスは不足、プラスは余剰） |
| G | 単位 | 錠、g など |

| I | メモ | 記録時のメモ |

- 棚卸し後、差異があった品目を確認する時

「差異品再カウント」モードで数え直して、理論在庫と一致した場合、その行は自動的にシートから削除されます。

## 9. 困った時の対処

| 症状 | 対処 |
|---|---|
| 記録が失敗した（赤いメッセージ） | ネットワーク接続を確認 → 該当品目を再度記録 |
| 検索しても薬が出ない | 別のキーワード（カナ名、YJコード）で試す |
| 画面が最新にならない | 画面右上の工具ボタンから「アプリを最新版に更新」を押す |
| 進捗バーの数字がおかしい | 棚番一覧の右上「更新」ボタンで再読込 |
| 誤って記録した | 直後なら「取消」ボタン、または「直近の入力」から該当行を削除 |
| 「続きから再開しますか？」が出るが最初からやりたい | ダイアログで「キャンセル」を選ぶ |
| ネットが切れた | 記録は失敗するので、電波が入る場所で再度記録 |
| よく分からない、動かない | 管理者に相談してください |

## 10. 触ってはいけない場所（管理者専用）

以下は誤操作するとデータが失われる可能性があるため、絶対に触らないでください。

### ヘッダの歯車ボタン（⚙ 管理者メニュー）

管理者メニューが開きます。以下の管理系操作が集まっていて、誤って実行すると影響が大きいものばかりです。

- 医薬品マスタを更新 — マスタを丸ごと入れ替えます
- 新しい棚卸しを始める — 進捗を全てリセットします
- 切迫品シートをクリア — 切迫品を空にします
- スプレッドシート切替 — 記録先の Google スプレッドシートを変えます

### ヘッダのカレンダーバッジ（月バッジ）

現在の棚卸しの月を変更する画面が開きます。誤って触ると、記録が別の月として保存される可能性があります。

### まとめ

**触っていいのは以下だけです。**

- 「個別記録」タブの中身
- 「棚卸しモード」タブの中身（品目カード操作を含む）
- 実施日（ヘッダの日付入力欄）
- 工具ボタン（🔧 従業員メニュー）の中の以下：
  - 「VANの在庫データを取込」ボタン（在庫更新用）
  - 「切迫品シートを更新」ボタン（棚卸し後に必ず実行）
  - 「使い方マニュアルを開く」ボタン
  - 「アプリを最新版に更新」ボタン
